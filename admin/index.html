<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统管理后台 · 连单系统</title>
  <style>
    :root { --side: 200px; --top: 48px; --green: #16a34a; --orange: #f97316; --red: #ef4444; --blue: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f3f3f3; color: #333; }
    button, input, select, textarea { font-family: inherit; }
    #login { min-height: 100vh; background: #3b4b5c; display: flex; align-items: center; justify-content: center; }
    .login-box { width: 360px; text-align: center; color: #fff; }
    .login-box h2 { margin-bottom: 24px; letter-spacing: 4px; }
    .login-box input {
      width: 100%; height: 40px; margin-bottom: 12px; padding: 0 12px 0 36px;
      background: transparent; border: 1px solid #9aa4b0; color: #fff; outline: none;
    }
    .field { position: relative; }
    .field span { position: absolute; left: 10px; top: 10px; opacity: .8; }
    .login-box button { width: 100%; height: 42px; border: 0; background: #4da3ff; color: #fff; cursor: pointer; }
    .app { display: none; min-height: 100vh; }
    .top {
      height: var(--top); background: #fff; border-bottom: 1px solid #e5e5e5;
      display: flex; align-items: center; padding: 0 12px; gap: 12px; position: sticky; top: 0; z-index: 20;
      white-space: nowrap;
    }
    .brand { color: #16a34a; font-weight: 700; }
    .top-link { padding: 6px 8px; cursor: pointer; }
    .top-link.active { color: #16a34a; font-weight: 600; }
    .pill { background: #f97316; color: #fff; padding: 3px 8px; border-radius: 2px; font-size: 12px; }
    .clock { margin-left: auto; color: #111; font-size: 13px; }
    .badge { display: flex; gap: 12px; font-size: 13px; }
    .badge b { color: #ef4444; }
    .layout { display: flex; min-height: calc(100vh - var(--top)); }
    .side { width: var(--side); background: #fff; border-right: 1px solid #eee; padding: 8px 0; flex-shrink: 0; }
    .group-title { padding: 10px 18px; color: #888; font-size: 12px; }
    .menu { list-style: none; }
    .menu li { padding: 9px 22px; cursor: pointer; font-size: 14px; }
    .menu li:hover { background: #f6f6f6; }
    .menu li.active { color: #16a34a; background: #f0fdf4; }
    .main { flex: 1; padding: 10px 12px 32px; min-width: 0; }
    .crumb { background: #fff; padding: 8px 12px; margin-bottom: 8px; border: 1px solid #eee; }
    .panel { background: #fff; border: 1px solid #eee; padding: 12px; }
    .search { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 12px; align-items: center; }
    .search .item { display: flex; align-items: center; gap: 6px; }
    .search label { font-size: 12px; color: #666; min-width: 56px; text-align: right; }
    .search input, .search select { height: 30px; border: 1px solid #ddd; padding: 0 8px; width: 140px; }
    .btn { height: 28px; padding: 0 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; border-radius: 2px; }
    .btn.primary { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn.orange { background: #f97316; color: #fff; border: 0; }
    .btn.red { background: #ef4444; color: #fff; border: 0; }
    .btn.blue { background: #2563eb; color: #fff; border: 0; }
    .btn.gray { background: #64748b; color: #fff; border: 0; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 220px); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1680px; }
    table.compact { min-width: 980px; }
    th, td { border: 1px solid #eee; padding: 8px; vertical-align: top; text-align: left; }
    th { background: #fafafa; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    th.sticky-op, td.sticky-op {
      position: sticky; right: 0; background: #fff; z-index: 3; min-width: 96px;
      box-shadow: -6px 0 8px rgba(0,0,0,.06);
    }
    th.sticky-op { z-index: 4; background: #fafafa; }
    .info { line-height: 1.8; }
    .ops { display: flex; flex-direction: column; gap: 6px; width: 92px; }
    .ops .btn { width: 100%; }
    .addr { word-break: break-all; font-family: Consolas, "Courier New", monospace; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 2px; color: #fff; font-size: 11px; margin: 0 2px 2px 0; }
    .tag.green { background: #16a34a; }
    .tag.blue { background: #0ea5e9; }
    .tag.orange { background: #f97316; }
    .tag.red { background: #ef4444; }
    .tag.gray { background: #94a3b8; }
    .muted { color: #888; }
    .pager { margin-top: 10px; font-size: 12px; color: #666; display: flex; gap: 8px; align-items: center; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 50; }
    .modal.show { display: flex; }
    .modal .box { background: #fff; width: 460px; max-width: calc(100vw - 24px); padding: 18px; max-height: 90vh; overflow: auto; }
    .modal h3 { margin-bottom: 12px; }
    .modal .row { margin: 8px 0; }
    .modal .row label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 8px; border: 1px solid #ddd; }
    .modal .actions { margin-top: 14px; display: flex; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: #fff; padding: 18px; border: 1px solid #eee; }
    .stat b { font-size: 22px; display: block; margin-top: 8px; }
    #toast {
      display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #111; color: #fff; padding: 8px 16px; border-radius: 4px; z-index: 80; font-size: 13px;
    }
    #toast.show { display: block; }
    #toast.err { background: #b91c1c; }
    .stuck-page { background: #fff; min-height: 560px; padding: 18px 22px 40px; }
    .stuck-crumb { color: #999; font-size: 13px; margin-bottom: 18px; }
    .stuck-head { display: grid; grid-template-columns: 220px 1fr 220px; gap: 16px; margin-bottom: 22px; }
    .stuck-head .k { color: #16a34a; font-size: 13px; margin-bottom: 6px; }
    .stuck-head .v { color: #333; font-size: 14px; }
    .stuck-tools { display: flex; justify-content: flex-end; gap: 8px; margin: 8px 0 16px; }
    .btn.gold { background: #e6a23c; color: #fff; border: 0; height: 32px; padding: 0 14px; }
    .plan-box { border-top: 1px solid #f0f0f0; padding-top: 8px; }
    .plan-title { font-size: 14px; margin-bottom: 10px; }
    .modal .box.wide { width: 640px; padding: 22px 28px 18px; position: relative; }
    .modal .box.wide h3 { font-size: 16px; font-weight: 600; }
    .modal .x { position: absolute; right: 16px; top: 14px; border: 0; background: none; font-size: 20px; cursor: pointer; color: #999; }
    .el-label { color: #16a34a; font-size: 13px; margin-bottom: 8px; }
    .el-label em { color: #999; font-style: normal; margin-left: 6px; }
    .hint { color: #f56c6c; font-size: 12px; margin-top: 6px; }
    .hint.req { margin-top: 4px; }
    .modal .actions.center { justify-content: center; gap: 16px; margin-top: 22px; }
    .btn.teal { background: #13c2c2; color: #fff; border: 0; height: 36px; min-width: 96px; }
    .btn.warn { background: #ff7a45; color: #fff; border: 0; height: 36px; min-width: 96px; }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-box">
      <h2>系统管理</h2>
      <div class="field"><span>👤</span><input id="u" placeholder="登录账号" value="ouzai888" /></div>
      <div class="field"><span>🔒</span><input id="p" type="password" placeholder="登录密码" value="a321321" /></div>
      <button onclick="login()">立即登录</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="top">
      <div class="brand">连单系统 v1.0</div>
      <div class="top-link active" id="navUsers" onclick="show('users')">管理中心</div>
      <div class="top-link" id="navStats" onclick="show('stats')">数据统计</div>
      <span class="pill">改图工具</span>
      <div class="clock" id="clock"></div>
      <div class="badge">充值 <b id="rCount">0</b> 提现 <b id="wCount">0</b></div>
      <div>zh-cn</div>
      <div id="adminName">ouzai888</div>
      <button class="btn" onclick="logout()">退出登录</button>
    </div>
    <div class="layout">
      <aside class="side">
        <div class="group-title">用户管理</div>
        <ul class="menu">
          <li class="active" onclick="show('users', this)">用户管理</li>
          <li onclick="show('workers', this)">做单账户管理</li>
          <li onclick="show('wallets', this)">提现地址</li>
          <li onclick="show('banks', this)">银行卡提现管理</li>
          <li onclick="show('dup', this)">用户查重</li>
        </ul>
        <div class="group-title">财务系统</div>
        <ul class="menu">
          <li onclick="show('payaddr', this)">前端充值地址</li>
          <li onclick="show('recharge', this)">充值订单</li>
          <li onclick="show('chain', this)">TRC20链上监控</li>
          <li onclick="show('withdraw', this)">提款订单</li>
          <li onclick="show('changes', this)">钱包明细</li>
        </ul>
        <div class="group-title">代理中心</div>
        <ul class="menu">
          <li onclick="show('review', this)">用户提现审核</li>
        </ul>
      </aside>
      <main class="main">
        <div class="crumb" id="crumb">用户列表</div>
        <div class="panel" id="content"></div>
      </main>
    </div>
  </div>

  <div class="modal" id="modal"></div>
  <div id="toast"></div>

  <script>
    const token = { v: localStorage.getItem("admin_token") || "" };
    const titles = {
      users: "用户列表", workers: "做单账户管理", wallets: "提现地址",
      banks: "银行卡提现管理", dup: "用户查重", payaddr: "前端充值地址",
      recharge: "充值订单", chain: "TRC20链上监控", withdraw: "提款订单", changes: "钱包明细",
      review: "用户提现审核", stats: "数据统计", stuckedit: "编辑卡单"
    };
    const state = { page: "users", pageNo: 1, limit: 10, accountType: "", filters: {} };
    const cache = { users: [] };

    function toast(msg, err) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = err ? "show err" : "show";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.className = ""; }, 2200);
    }
    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function api(url, data = {}) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "admin-token": token.v },
        body: JSON.stringify(data)
      });
      return r.json();
    }

    async function login() {
      const res = await api("/admin/api/login", { username: u.value, password: p.value });
      if (res.code !== 1) return toast(res.info, 1);
      token.v = res.data.token;
      localStorage.setItem("admin_token", token.v);
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      adminName.textContent = res.data.username;
      show("users");
      tick();
    }
    function logout() {
      localStorage.removeItem("admin_token");
      location.reload();
    }
    function tick() {
      clock.textContent = "华盛顿时间： " + new Date().toISOString().replace("T", " ").slice(0, 19);
      setTimeout(tick, 1000);
    }
    function setActive(el) {
      document.querySelectorAll(".menu li").forEach((x) => x.classList.remove("active"));
      if (el) el.classList.add("active");
    }
    async function show(name, el) {
      state.page = name;
      if (name === "users" || name === "workers") state.accountType = name === "workers" ? "1" : "";
      if (el) setActive(el);
      document.querySelectorAll(".top-link").forEach((x) => x.classList.remove("active"));
      (name === "stats" ? navStats : navUsers).classList.add("active");
      crumb.textContent = titles[name] || name;
      if (name === "users" || name === "workers") return renderUsers();
      if (name === "stats") return renderStats();
      if (name === "payaddr") return renderPayAddr();
      if (name === "recharge") return renderRecharge();
      if (name === "chain") return renderChain();
      if (name === "withdraw" || name === "review") return renderWithdraw();
      if (name === "changes") return renderSimple("changes", ["id","phone","type","amount","after","remark","time"]);
      if (name === "wallets") return renderUsersExtra("address");
      if (name === "banks") return renderUsersExtra("bank");
      if (name === "dup") return renderDup();
      if (name === "stuckedit") return renderStuckPage();
    }

    function collectFilters() {
      const val = (id) => (document.getElementById(id) ? document.getElementById(id).value : "");
      state.filters = {
        id: val("f_id"), phone: val("f_phone"), name: val("f_name"),
        register_ip: val("f_rip"), last_ip: val("f_lip"), yqm: val("f_yqm"),
        address: val("f_addr"), remark: val("f_remark"), accountType: val("f_type") || state.accountType,
        vip_level: val("f_vip"), source_web: val("f_web"), status: val("f_status")
      };
      state.pageNo = 1;
      renderUsers();
    }

    async function renderUsers() {
      const q = { page: state.pageNo, limit: state.limit, ...state.filters };
      if (state.accountType !== "" && !q.accountType) q.accountType = state.accountType;
      const res = await api("/admin/api/users", q);
      if (res.code !== 1) return toast(res.info || "加载失败", 1);
      const rows = res.data.list || [];
      cache.users = rows;
      const pg = res.data.page || { current: 1, total: rows.length, pages: 1 };
      const f = state.filters;
      content.innerHTML = `
        ${state.page === "workers" ? `<div class="search"><button class="btn primary" onclick="openCreateWorker()">添加做单账户</button>
          <span class="muted">做单账户可以登录用户端做任务。</span></div>` : ""}
        <div class="search">
          <div class="item"><label>用户ID</label><input id="f_id" value="${esc(f.id || "")}" placeholder="请输入用户ID"></div>
          <div class="item"><label>用户手机</label><input id="f_phone" value="${esc(f.phone || "")}" placeholder="请输入用户手机"></div>
          <div class="item"><label>用户名</label><input id="f_name" value="${esc(f.name || "")}" placeholder="请输入用户名"></div>
          <div class="item"><label>注册IP</label><input id="f_rip" value="${esc(f.register_ip || "")}" placeholder="请输入注册IP"></div>
          <div class="item"><label>登录IP</label><input id="f_lip" value="${esc(f.last_ip || "")}" placeholder="请输入登录IP"></div>
          <div class="item"><label>邀请码</label><input id="f_yqm" value="${esc(f.yqm || "")}" placeholder="请输入邀请码"></div>
          <div class="item"><label>充值地址</label><input id="f_addr" value="${esc(f.address || "")}" placeholder="请输入充值地址"></div>
          <div class="item"><label>备注</label><input id="f_remark" value="${esc(f.remark || "")}" placeholder="搜索备注"></div>
          <div class="item"><label>账号类型</label>
            <select id="f_type">
              <option value="">-- 全部 --</option>
              <option value="0" ${String(f.accountType)==="0"?"selected":""}>真实账号</option>
              <option value="1" ${String(f.accountType)==="1"?"selected":""}>做单账户</option>
              <option value="2" ${String(f.accountType)==="2"?"selected":""}>业务员账号</option>
            </select>
          </div>
          <div class="item"><label>用户等级</label>
            <select id="f_vip">
              <option value="">全部</option>
              <option value="1" ${f.vip_level==="1"?"selected":""}>VIP1</option>
              <option value="2" ${f.vip_level==="2"?"selected":""}>VIP2</option>
              <option value="3" ${f.vip_level==="3"?"selected":""}>VIP3</option>
            </select>
          </div>
          <div class="item"><label>所属平台</label>
            <select id="f_web">
              <option value="">全部</option>
              <option value="Luxury" ${f.source_web==="Luxury"?"selected":""}>Luxury</option>
            </select>
          </div>
          <div class="item"><label>账号状态</label>
            <select id="f_status">
              <option value="">全部</option>
              <option value="1" ${f.status==="1"?"selected":""}>正常</option>
              <option value="0" ${f.status==="0"?"selected":""}>冻结</option>
            </select>
          </div>
          <button class="btn primary" onclick="collectFilters()">搜索</button>
          <button class="btn" onclick="state.filters={};state.pageNo=1;renderUsers()">重置</button>
        </div>
        <div class="table-wrap"><table>
          <tr>
            <th>用户ID</th><th>用户信息</th><th>信用分</th><th>任务信息</th><th>余额</th>
            <th>上级代理</th><th>盈利</th><th>盈亏</th><th>借钱</th><th>充值/提现($)</th>
            <th>充值地址</th><th>最近登录</th><th>注册时间</th>
          </tr>
          ${rows.map(userRow).join("") || `<tr><td colspan="13">暂无数据</td></tr>`}
        </table></div>
        <div class="pager">
          共 ${pg.total} 条，第 ${pg.current}/${pg.pages} 页
          <button class="btn" ${pg.current<=1?"disabled":""} onclick="state.pageNo--;renderUsers()">上一页</button>
          <button class="btn" ${pg.current>=pg.pages?"disabled":""} onclick="state.pageNo++;renderUsers()">下一页</button>
        </div>
      `;
      refreshBadges();
    }

    function userRow(u) {
      const typeName = u.accountType === 1 ? "做单账户" : u.accountType === 2 ? "业务员账号" : "真实账号";
      return `<tr>
        <td>${u.id}</td>
        <td class="info">
          <span class="tag green">${typeName}</span><span class="tag blue">${esc(u.source_web || "Luxury")}</span>
          ${u.frozen ? '<span class="tag red">冻结</span>' : ""}<br>
          用户手机：${esc(u.phone)}<br>用户名：${esc(u.name)}<br>邀请码:${esc(u.yqm)}<br>
          会员等级:${esc(u.vip_name)}<br>做单佣金:${esc(u.commission_rate)}%<br>
          ${u.remark ? `<div class="tag orange" style="white-space:normal;max-width:240px;line-height:1.4;margin:4px 0">备注：${esc(u.remark)}</div>` : `<div class="muted">备注：无</div>`}
          <button class="btn" onclick="openBank(${u.id})">银行卡信息</button>
          <button class="btn orange" onclick="openRemark(${u.id})">备注</button>
        </td>
        <td>${u.credit}</td>
        <td class="info">
          当前订单号:<br>${esc(u.current_order)}${u.current_order_happy ? ' <span class="tag orange">连单</span>' : ""}<br>
          ${u.current_order_amount ? "金额:" + u.current_order_amount + "<br>" : ""}
          进度:${esc(u.progress)}<br>
          ${Number(u.stuck) ? `卡单第${u.stuck_at || "-"}单 / ${esc(u.stuck_amount || "-")}<br>` : ""}
          <div class="ops">
            <button class="btn ${Number(u.grab_enabled) ? "gray" : "orange"}" onclick="act(${u.id},'grab')">
              ${Number(u.grab_enabled) ? "关闭抢单" : "开启抢单"}
            </button>
            <button class="btn red" onclick="openStuckPage(${u.id})">设置卡单</button>
            <button class="btn orange" onclick="resetTask(${u.id})">重置任务</button>
          </div>
        </td>
        <td class="info">可用余额:${u.amount}<br>冻结余额:${u.amount_frozen}<br>差额:${u.amount_difference || "0.0000"}</td>
        <td class="info">${esc(u.parent || "-")}<br>代理ID：${u.agent_id || "-"}</td>
        <td class="info">总盈利${u.total_commission}<br>今日盈利${u.amount_today}</td>
        <td>${u.profit_loss || "0.0000"}</td>
        <td>${u.loan || "-"}</td>
        <td class="info">总提款:${u.total_withdraw}<br>总充值:${u.total_recharge}<br>
          <button class="btn" onclick="openChange(${u.id})">账变</button></td>
        <td class="addr">${esc(u.recharge_address || "-")}${u.recharge_address ? `<div class="muted">TRC20</div>` : ""}</td>
        <td class="info">登录次数:${u.login_count || 0}<br>IP:${esc(u.last_ip || "-")}</td>
        <td class="info">${esc(u.add_time_str)}<br>
          <div class="ops">
            <button class="btn" onclick="openEdit(${u.id})">编辑</button>
            <button class="btn red" onclick="act(${u.id},'freeze')">${u.frozen ? "解冻" : "冻结"}</button>
          </div>
        </td>
      </tr>`;
    }

    function findUser(id) {
      return cache.users.find((x) => String(x.id) === String(id)) || { id };
    }

    async function act(id, action, extra = {}) {
      const res = await api("/admin/api/user/action", { id, action, ...extra });
      if (res.code !== 1) return toast(res.info || "操作失败", 1);
      toast(res.info || "已处理");
      renderUsers();
    }
    function resetTask(id) {
      if (!confirm("确认重置该用户今日任务？待处理订单会取消，进度归零。")) return;
      act(id, "reset");
    }
    function openCreateWorker() {
      modal.className = "modal show";
      modal.innerHTML = `<div class="box">
        <h3>添加做单账户</h3>
        <div class="row"><label>账号/手机</label><input id="w_phone" placeholder="登录账号"></div>
        <div class="row"><label>用户名</label><input id="w_name" placeholder="可空，默认等于账号"></div>

          </tr>
          ${list.map((r) => `<tr>
            <td>${r.id}</td><td>${esc(r.phone)}</td><td>${r.amount}</td><td>${esc(r.type)}</td>
            <td>${statusTag(r.status_str)}</td>
            <td>${statusTag(r.chain_status || (Number(r.status)===1 && r.review_by==="chain" ? "confirmed" : ""))}</td>
            <td class="addr">${r.tx ? `<a href="https://tronscan.org/#/transaction/${esc(r.tx)}" target="_blank">${esc(String(r.tx).slice(0,12))}...</a>` : "-"}</td>
            <td>${esc(r.time)}</td>
            <td class="sticky-op">${isPendingRecharge(r) ? `<div class="ops">
              <button type="button" class="btn primary" onclick="reviewRecharge('${r.id}',1)">通过</button>
              <button type="button" class="btn red" onclick="reviewRecharge('${r.id}',2)">拒绝</button>
            </div>` : `<span class="muted">-</span>`}</td>
          </tr>`).join("") || "<tr><td colspan='9'>暂无数据</td></tr>"}
        </table></div>
        <div class="pager">
          共 ${pg.total} 条，第 ${pg.current}/${pg.pages} 页
          <button class="btn" ${pg.current<=1?"disabled":""} onclick="state.rechargePage=${pg.current-1};renderRecharge()">上一页</button>
          <button class="btn" ${pg.current>=pg.pages?"disabled":""} onclick="state.rechargePage=${pg.current+1};renderRecharge()">下一页</button>
        </div>`;
    }
    async function reviewRecharge(id, status) {
      const res = await api("/admin/api/recharge/review", { id, status });
      if (res.code !== 1) return toast(res.info, 1);
      toast(res.info || "已处理");
      renderRecharge();
      refreshBadges();
    }
    window.reviewRecharge = reviewRecharge;
    window.renderRecharge = renderRecharge;
    async function renderChain() {
      const res = await api("/admin/api/chain/txs");
      const d = res.data || {};
      const w = d.watch || {};
      const list = d.list || [];
      content.innerHTML = `
        <div class="search">
          <button class="btn primary" onclick="syncChain()">立即同步</button>
          <span class="muted">监控 ${(w.addresses || [d.address]).filter(Boolean).length} 个地址 ｜ 上次 ${esc(w.lastPoll || "-")} ｜ ${esc(w.lastError || "正常")} ｜ 待审 ${d.pending || 0}</span>
        </div>
        <div class="muted" style="margin:0 0 10px;word-break:break-all">${esc((w.addresses || [d.address]).filter(Boolean).join(" | ") || "-")}</div>
        <div class="table-wrap"><table class="compact">
          <tr><th>时间</th><th>金额 USDT</th><th>From</th><th>Tx</th><th>匹配用户</th><th>状态</th></tr>
          ${list.map((r) => `<tr>
            <td>${esc(r.time)}</td><td>${r.amount}</td>
            <td class="addr">${esc(r.from || "-")}</td>
            <td class="addr">${r.txid ? `<a href="https://tronscan.org/#/transaction/${esc(r.txid)}" target="_blank">${esc(String(r.txid).slice(0,14))}...</a>` : "-"}</td>
            <td>${esc(r.matched_phone || "-")}</td>
            <td>${statusTag(r.status)}</td>
          </tr>`).join("") || "<tr><td colspan='6'>还没有链上记录，点同步或等自动轮询</td></tr>"}
        </table></div>`;
    }
    async function syncChain() {
      const res = await api("/admin/api/chain/sync");
      if (res.code !== 1) return toast(res.info, 1);
      toast(res.info || "已同步");
      renderChain();
    }
    async function renderSimple(path, cols) {
      const res = await api("/admin/api/" + path, { page: 1 });
      const list = res.data.list || [];
      content.innerHTML = `<div class="table-wrap"><table class="compact">
        <tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr>
        ${list.map((r) => `<tr>${cols.map((c) => `<td>${esc(r[c] ?? "")}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}">暂无数据</td></tr>`}
      </table></div>`;
    }
    async function renderWithdraw() {
      const res = await api("/admin/api/withdraws", { page: 1 });
      const list = res.data.list || [];
      content.innerHTML = `<div class="table-wrap"><table class="compact">
        <tr><th>ID</th><th>用户</th><th>金额</th><th>地址/卡</th><th>状态</th><th>时间</th><th>操作</th></tr>
        ${list.map((r) => `<tr>
          <td>${r.id}</td><td>${esc(r.phone)}</td><td>${r.amount}</td>
          <td class="addr">${esc(r.address || r.bank_account || "")}</td><td>${esc(r.status_str)}</td><td>${esc(r.time)}</td>
          <td>${r.status === 0 ? `<button class="btn primary" onclick="review(${r.id},1)">通过</button>
            <button class="btn red" onclick="review(${r.id},2)">拒绝</button>` : "-"}</td>
        </tr>`).join("") || "<tr><td colspan='7'>暂无数据</td></tr>"}
      </table></div>`;
    }
    async function review(id, status) {
      const res = await api("/admin/api/withdraw/review", { id, status });
      if (res.code !== 1) return toast(res.info, 1);
      toast("已处理");
      renderWithdraw();
    }
    async function renderUsersExtra(kind) {
      const res = await api("/admin/api/users", { limit: 50 });
      const list = res.data.list || [];
      content.innerHTML = `<div class="table-wrap"><table class="compact">
        <tr><th>用户</th><th>手机</th><th>${kind === "bank" ? "银行卡" : "提现地址"}</th></tr>
        ${list.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td class="addr">${
          kind === "bank" ? esc((u.bank_name || "") + " " + (u.bank_account || "-")) : esc(u.address || u.wallet_address || "-")
        }</td></tr>`).join("")}
      </table></div>`;
    }
    async function renderDup() {
      const res = await api("/admin/api/users", { limit: 50 });
      const list = res.data.list || [];
      const map = {};
      list.forEach((u) => { (map[u.last_ip || "-"] = map[u.last_ip || "-"] || []).push(u.phone); });
      content.innerHTML = `<div class="table-wrap"><table class="compact">
        <tr><th>IP</th><th>账号</th></tr>
        ${Object.entries(map).map(([ip, phones]) => `<tr><td>${esc(ip)}</td><td>${esc(phones.join(", "))}</td></tr>`).join("")}
      </table></div>`;
    }
    async function renderStats() {
      const res = await api("/admin/api/stats");
      const d = res.data || {};
      content.innerHTML = `<div class="stats">
        <div class="stat">用户数<b>${d.users || 0}</b></div>
        <div class="stat">总充值<b>${Number(d.recharge || 0).toFixed(4)}</b></div>
        <div class="stat">总提现<b>${Number(d.withdraw || 0).toFixed(4)}</b></div>
        <div class="stat">待审提现<b>${d.pendingWithdraw || 0}</b></div>
        <div class="stat">待审充值<b>${d.pendingRecharge || 0}</b></div>
      </div>`;
    }
    async function refreshBadges() {
      const s = await api("/admin/api/stats");
      rCount.textContent = s.data.pendingRecharge || 0;
      wCount.textContent = s.data.pendingWithdraw || 0;
    }
    if (token.v) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      tick();
      show("users");
    }
  </script>
</body>
</html>
